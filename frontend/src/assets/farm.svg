<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a45e"/>
      <stop offset="0.55" stop-color="#f6cf94"/>
      <stop offset="1" stop-color="#fbe8c4"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb455"/>
      <stop offset="0.5" stop-color="#5f8f3a"/>
      <stop offset="1" stop-color="#2f5d2a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7edf2"/>
      <stop offset="1" stop-color="#b9c5cf"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#fff3c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="460" fill="url(#sky)"/>
  <rect width="400" height="200" fill="url(#sun)"/>
  <!-- distant tree line and hills -->
  <path d="M0 118 Q60 96 130 112 T270 104 T400 114 V150 H0Z" fill="#7d8f55"/>
  <path d="M0 132 Q80 118 160 130 T400 126 V160 H0Z" fill="#587a3a"/>
  <!-- ground -->
  <path d="M0 134 H400 V460 H0Z" fill="url(#grass)"/>
  <!-- field strips in perspective -->
  <path d="M0 150 L400 142 L400 176 L0 190Z" fill="#b5c15f" opacity="0.8"/>
  <path d="M0 200 L400 182 L400 214 L0 240Z" fill="#6e9a3c" opacity="0.9"/>
  <path d="M250 160 L400 152 L400 300 L330 260Z" fill="#c8b774" opacity="0.55"/>
  <!-- dirt track -->
  <path d="M-10 330 L120 262 L400 190 L400 208 L132 284 L-10 360Z" fill="#c9a577" opacity="0.85"/>
  <!-- distant small buildings -->
  <g>
    <path d="M150 150 l46 -8 l4 6 l-46 9z" fill="#dfe6ec"/>
    <path d="M208 146 l34 -6 l3 5 l-34 7z" fill="#cfd8df"/>
    <path d="M262 140 l30 -5 l3 5 l-30 6z" fill="#e4eaef"/>
  </g>
  <!-- long poultry houses (diagonal roofs) -->
  <g>
    <path d="M10 330 L240 196 L262 206 L40 352Z" fill="url(#roof)"/>
    <path d="M10 330 L40 352 L40 362 L8 340Z" fill="#8a97a3"/>
    <path d="M10 330 L240 196" stroke="#f4f7f9" stroke-width="2"/>
    <path d="M25 341 L251 201" stroke="#9aa7b2" stroke-width="1" opacity="0.7"/>
    <path d="M60 372 L296 232 L318 243 L84 394Z" fill="url(#roof)"/>
    <path d="M60 372 L84 394 L84 404 L58 382Z" fill="#8a97a3"/>
    <path d="M60 372 L296 232" stroke="#f4f7f9" stroke-width="2"/>
    <path d="M120 420 L340 290 L366 304 L150 450Z" fill="url(#roof)"/>
    <path d="M120 420 L150 450 L150 460 L118 430Z" fill="#8a97a3"/>
    <path d="M120 420 L340 290" stroke="#f4f7f9" stroke-width="2"/>
  </g>
  <!-- small service buildings and silos -->
  <path d="M290 222 l26 -14 l14 8 l-26 14z" fill="#d9a07a"/>
  <path d="M290 222 l14 8 v9 l-14 -8z" fill="#a8704d"/>
  <circle cx="332" cy="214" r="5" fill="#dfe6ec"/>
  <circle cx="344" cy="209" r="5" fill="#cfd8df"/>
  <!-- trees -->
  <g fill="#2f5d2a" opacity="0.9">
    <circle cx="30" cy="236" r="12"/><circle cx="50" cy="226" r="10"/><circle cx="14" cy="252" r="14"/>
    <circle cx="372" cy="252" r="13"/><circle cx="388" cy="236" r="10"/>
  </g>
  <!-- low sun glow and soft vignette -->
  <rect width="400" height="460" fill="url(#sun)" opacity="0.5"/>
  <rect y="300" width="400" height="160" fill="#173a1c" opacity="0.18"/>
</svg>
