# AgriPilot: PostgreSQL + API + web (nginx). Copy .env.example to .env and fill it in first.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agripilot
      POSTGRES_DB: agripilot
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agripilot -d agripilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agripilot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db:5432/agripilot
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required (at least 32 random characters, see .env.example)}"
      TOTP_ENC_KEY: "${TOTP_ENC_KEY:?TOTP_ENC_KEY is required (32 bytes, base64 or hex, see .env.example)}"
      WEB_ORIGIN: "${WEB_ORIGIN:?WEB_ORIGIN is required, e.g. http://localhost:8080 (see .env.example)}"
      PORT: "3000"
      TRUST_PROXY: "1"
      # Only read by the explicit seed command (see README); harmless otherwise.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - api-uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db-data:
  api-uploads:
